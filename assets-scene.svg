<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 190" role="img" aria-label="The Little Ledger, animated clay bank scene">
  <rect width="800" height="190" fill="#f6efdc"/>
  <ellipse cx="400" cy="178" rx="380" ry="12" fill="#e6dcc2"/>
  <rect x="0" y="158" width="800" height="32" fill="#6b4a2f"/>
  <rect x="0" y="158" width="800" height="6" fill="#8a6544"/>
  <g id="left-bank">
    <rect x="70" y="82" width="150" height="76" rx="10" fill="#8fa98f"/>
    <polygon points="52,84 145,44 238,84" fill="#6b4a2f"/>
    <rect x="122" y="112" width="46" height="46" rx="6" fill="#4c3a28"/>
    <circle cx="145" cy="135" r="13" fill="#c9a227"/><circle cx="145" cy="135" r="7" fill="#6b4a2f"/>
    <rect x="88" y="92" width="26" height="26" rx="5" fill="#faf6ec"/><rect x="176" y="92" width="26" height="26" rx="5" fill="#faf6ec"/>
  </g>
  <g id="right-bank">
    <rect x="580" y="82" width="150" height="76" rx="10" fill="#8fa98f"/>
    <polygon points="562,84 655,44 748,84" fill="#6b4a2f"/>
    <rect x="632" y="112" width="46" height="46" rx="6" fill="#4c3a28"/>
    <circle cx="655" cy="135" r="13" fill="#c9a227"/><circle cx="655" cy="135" r="7" fill="#6b4a2f"/>
    <rect x="598" y="92" width="26" height="26" rx="5" fill="#faf6ec"/><rect x="686" y="92" width="26" height="26" rx="5" fill="#faf6ec"/>
  </g>
  <g id="coins" fill="#c9a227" stroke="#6b4a2f" stroke-width="2">
    <circle r="11"><animateMotion dur="5s" repeatCount="indefinite" path="M225 140 Q400 96 575 140"/></circle>
    <circle r="9"><animateMotion dur="5s" begin="-1.6s" repeatCount="indefinite" path="M225 140 Q400 96 575 140"/></circle>
    <circle r="10"><animateMotion dur="5s" begin="-3.2s" repeatCount="indefinite" path="M575 140 Q400 96 225 140"/></circle>
  </g>
  <g id="scale">
    <animateTransform attributeName="transform" type="rotate" values="-2 400 60;2 400 60;-2 400 60" dur="6s" repeatCount="indefinite"/>
    <line x1="400" y1="34" x2="400" y2="132" stroke="#6b4a2f" stroke-width="7" stroke-linecap="round"/>
    <line x1="308" y1="56" x2="492" y2="56" stroke="#c9a227" stroke-width="7" stroke-linecap="round"/>
    <circle cx="400" cy="34" r="9" fill="#c9a227" stroke="#6b4a2f" stroke-width="2"/>
    <g stroke="#6b4a2f" stroke-width="3"><path d="M308 56 L286 92 M308 56 L330 92" fill="none"/><path d="M492 56 L470 92 M492 56 L514 92" fill="none"/></g>
    <path d="M282 92 H334 A26 12 0 0 1 282 92" fill="#c9a227"/>
    <path d="M466 92 H518 A26 12 0 0 1 466 92" fill="#c9a227"/>
    <circle cx="308" cy="86" r="7" fill="#c9a227"/><circle cx="492" cy="86" r="7" fill="#c9a227"/>
  </g>
  <rect x="372" y="130" width="56" height="10" rx="5" fill="#6b4a2f"/>
</svg>
