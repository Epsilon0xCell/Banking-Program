<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 240" role="img" aria-label="Storm watch from the crow's nest, animated scene">
  <rect width="900" height="240" fill="#0d4a54"/>
  <g id="top-storey">
    <g id="cloud-bank" fill="#8b9597">
      <ellipse cx="180" cy="30" rx="150" ry="17"/><ellipse cx="430" cy="22" rx="170" ry="19"/><ellipse cx="690" cy="30" rx="150" ry="17"/>
      <animateTransform attributeName="transform" type="translate" values="0 0;-46 0;0 0" dur="38s" repeatCount="indefinite"/>
    </g>
    <g id="horizon-rock">
      <line x1="0" y1="86" x2="900" y2="80" stroke="#f0f6f2" stroke-width="2"/>
      <polygon id="far-sail" points="726,74 734,54 742,74" fill="#f0f6f2">
        <animateTransform attributeName="transform" type="translate" values="0 0;0 3;0 0" dur="5s" repeatCount="indefinite"/>
      </polygon>
      <animateTransform attributeName="transform" type="rotate" values="-0.5 450 84;0.5 450 84;-0.5 450 84" dur="9s" repeatCount="indefinite"/>
    </g>
  </g>
  <g id="middle-storey">
    <rect id="mast" x="444" y="40" width="11" height="168" fill="#241c12"/>
    <g id="signal-flags">
      <polygon points="455,64 512,70 500,80 512,92 455,96" fill="#b0542c"><animate attributeName="points" values="455,64 512,70 500,80 512,92 455,96;455,64 508,64 498,80 508,98 455,96;455,64 512,70 500,80 512,92 455,96" dur="1.6s" repeatCount="indefinite"/></polygon>
      <polygon points="444,108 392,114 402,124 392,134 444,138" fill="#f0f6f2"><animate attributeName="points" values="444,108 392,114 402,124 392,134 444,138;444,108 396,106 404,124 396,140 444,138;444,108 392,114 402,124 392,134 444,138" dur="1.9s" repeatCount="indefinite"/></polygon>
      <polygon points="455,148 504,154 494,163 504,174 455,178" fill="#e8a43e"><animate attributeName="points" values="455,148 504,154 494,163 504,174 455,178;455,148 501,147 492,163 501,179 455,178;455,148 504,154 494,163 504,174 455,178" dur="1.7s" repeatCount="indefinite"/></polygon>
    </g>
    <g id="rigging" stroke="#141210" stroke-width="1.6">
      <line x1="447" y1="60" x2="180" y2="196"><animateTransform attributeName="transform" type="translate" values="0 0;0.7 0;0 0" dur="0.9s" repeatCount="indefinite"/></line>
      <line x1="452" y1="60" x2="724" y2="190"><animateTransform attributeName="transform" type="translate" values="0 0;-0.7 0;0 0" dur="1.1s" repeatCount="indefinite"/></line>
    </g>
    <g id="spray" stroke="#f0f6f2" stroke-width="2.4" stroke-linecap="round">
      <line x1="-90" y1="150" x2="30" y2="128" opacity="0"><animateTransform attributeName="transform" type="translate" values="0 0;980 0" dur="6s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.85;0" dur="6s" repeatCount="indefinite"/></line>
      <line x1="-90" y1="188" x2="10" y2="170" opacity="0"><animateTransform attributeName="transform" type="translate" values="0 0;980 0" dur="6s" begin="3s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.8;0" dur="6s" begin="3s" repeatCount="indefinite"/></line>
    </g>
    <g id="gulls-circling">
      <g id="gull-orbit">
        <path d="M0 -52 a52 20 0 1 0 0.1 0" fill="none"/>
        <g id="gull-a"><path d="M-13 0 q7 -8 13 0 q6 -8 13 0" fill="none" stroke="#f0f6f2" stroke-width="2.6"/></g>
        <animateMotion dur="17s" repeatCount="indefinite" path="M450 44 m-120 0 a120 30 0 1 0 240 0 a120 30 0 1 0 -240 0"/>
      </g>
    </g>
  </g>
  <g id="bottom-storey">
    <g id="barrel-base">
      <rect x="0" y="208" width="900" height="32" fill="#2c2115"/>
      <g stroke="#171310" stroke-width="3"><line x1="80" y1="210" x2="76" y2="238"/><line x1="220" y1="210" x2="216" y2="238"/><line x1="360" y1="210" x2="356" y2="238"/><line x1="540" y1="210" x2="536" y2="238"/><line x1="680" y1="210" x2="676" y2="238"/><line x1="820" y1="210" x2="816" y2="238"/></g>
      <ellipse id="rope-coil" cx="120" cy="222" rx="42" ry="9" fill="none" stroke="#aa8e60" stroke-width="4">
        <animate attributeName="rx" values="42;37;42" dur="6s" repeatCount="indefinite"/>
      </ellipse>
    </g>
    <g id="chain-links" fill="none" stroke="#3c3c3e" stroke-width="3">
      <g id="chain-run">
        <ellipse cx="600" cy="224" rx="13" ry="6"/><ellipse cx="630" cy="224" rx="13" ry="6"/><ellipse cx="660" cy="224" rx="13" ry="6"/><ellipse cx="690" cy="224" rx="13" ry="6"/>
        <animateTransform attributeName="transform" type="translate" values="0 0;30 0" dur="6s" repeatCount="indefinite"/>
      </g>
    </g>
  </g>
</svg>
